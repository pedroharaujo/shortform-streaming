[project]
name = "shortform-streaming-backend"
version = "0.1.0"
description = "Django backend for the Shortform Streaming MVP"
requires-python = ">=3.12,<3.15"
dependencies = [
    "dj-database-url>=2.3,<4",
    "django>=5.2,<5.3",
    "djangorestframework>=3.16,<3.19",
    "drf-spectacular>=0.28,<1",
    "psycopg[binary]>=3.2,<3.3",
]

[dependency-groups]
dev = [
    "django-stubs[compatible-mypy]>=5.2,<5.3",
    "djangorestframework-stubs[compatible-mypy]>=3.16,<3.17",
    "mypy>=1.17,<2",
    "pytest>=8.4,<9",
    "pytest-cov>=6,<8",
    "pytest-django>=4.11,<5",
    "ruff>=0.12,<0.15",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.local"
pythonpath = ["backend"]
testpaths = ["backend/tests"]
addopts = "--strict-config --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
strict = true
mypy_path = "backend"

[tool.django-stubs]
django_settings_module = "config.settings.local"

[[tool.mypy.overrides]]
module = ["drf_spectacular.*"]
ignore_missing_imports = true
