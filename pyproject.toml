[project]
name = "shortform-streaming-backend"
version = "0.1.0"
description = "Django backend for the Shortform Streaming MVP"
requires-python = ">=3.12,<3.15"
dependencies = [
    "dj-database-url>=2.3,<4",
    "django>=6.1,<6.2",
    "djangorestframework>=3.16,<3.19",
    "drf-spectacular>=0.28,<1",
    "firebase-admin>=6.8,<8",
    "google-cloud-storage>=2.14,<4",
    "gunicorn>=23,<26",
    "psycopg[binary]>=3.2,<3.4",
    "whitenoise>=6.8,<7",
]

[dependency-groups]
dev = [
    "django-stubs[compatible-mypy]>=6.1,<6.2",
    "djangorestframework-stubs[compatible-mypy]>=3.18,<3.19",
    "mypy>=1.17,<3",
    "pytest>=8.4,<10",
    "pytest-cov>=6,<8",
    "pytest-django>=4.11,<5",
    "ruff>=0.12,<0.17",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.local"
pythonpath = ["backend"]
testpaths = ["backend/tests"]
addopts = "--strict-config --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]

[tool.ruff.lint.per-file-ignores]
"backend/**/migrations/*.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
strict = true
mypy_path = "backend"

[tool.django-stubs]
django_settings_module = "config.settings.local"

[[tool.mypy.overrides]]
module = ["drf_spectacular.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["firebase_admin", "firebase_admin.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["google.cloud", "google.cloud.storage", "google.cloud.storage.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["gunicorn", "gunicorn.*", "whitenoise", "whitenoise.*"]
ignore_missing_imports = true
