name: AI governance

on:
  pull_request:
    paths:
      - "AGENTS.md"
      - "ai/**"
      - ".codex/**"
      - ".cursor/**"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/labels.yml"
      - ".github/pull_request_template.md"
      - ".github/workflows/ai-governance.yml"
      - "docs/AI_DEVELOPMENT.md"
      - "scripts/validate_ai_governance.py"
  push:
    branches:
      - main
    paths:
      - "AGENTS.md"
      - "ai/**"
      - ".codex/**"
      - ".cursor/**"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/labels.yml"
      - ".github/pull_request_template.md"
      - ".github/workflows/ai-governance.yml"
      - "docs/AI_DEVELOPMENT.md"
      - "scripts/validate_ai_governance.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate agent contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Validate AI governance files
        run: python scripts/validate_ai_governance.py
