name: OpenTofu validate

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tofu-validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: OpenTofu validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.11.14
      - name: Check formatting
        working-directory: infra
        run: tofu fmt -check -recursive
      - name: Initialize without backend
        working-directory: infra/environments/staging
        run: tofu init -backend=false -input=false -lockfile=readonly
      - name: Validate
        working-directory: infra/environments/staging
        run: tofu validate
      - name: Test secret configuration with a mocked provider
        working-directory: infra/environments/staging
        run: tofu test -no-color
