        episode_id:
          type: string
          description: Opaque episode public id.
        lock_reasons:
          type: array
          items:
            $ref: '#/components/schemas/LockReasonsEnum'
          description: 'Non-empty machine-readable lock reasons. Closed set: login_required,
            entitlement_required.'
        methods:
          type: array
          items:
            $ref: '#/components/schemas/OfferMethod'
          description: Currently available unlock methods. Empty for anonymous locks
            and when rewarded ads are disabled. Never includes coin, subscription,
            or a playback URL.
      required:
      - decision
      - episode_id
      - lock_reasons
      - methods
    EpisodeOffersResponse:
      oneOf:
      - $ref: '#/components/schemas/EpisodeOffersGranted'
      - $ref: '#/components/schemas/EpisodeOffersLocked'
      discriminator:
        propertyName: decision
        mapping:
          granted: '#/components/schemas/EpisodeOffersGranted'
          locked: '#/components/schemas/EpisodeOffersLocked'
    ErrorEnvelope:
      type: object
      description: Stable API error envelope. `message` is a safe, user-displayable
        string. `request_id` is the correlation identifier for the request.
      required:
      - code
      - message
      - request_id
      properties:
        code:
          type: string
          description: Stable machine-readable error code.
          minLength: 1
        message:
          type: string
          description: Safe, user-displayable error message. Never includes secrets.
        request_id:
          type: string
          description: Correlation / request identifier for support and tracing.
          minLength: 1
        field_errors:
          type: array
          description: Optional per-field validation errors.
          items:
            $ref: '#/components/schemas/FieldError'
    FieldError:
      type: object
      description: A single field-level validation error.
      required:
      - field
      - code
      - message
      properties:
        field:
          type: string
          description: Field name, or empty for non-field errors.
        code:
          type: string
          description: Machine-readable field error code.
          minLength: 1
        message:
          type: string
          description: Safe, user-displayable field message.
    GrantSourceEnum:
      enum:
      - admob_ssv
      type: string
      description: '* `admob_ssv` - admob_ssv'
    HealthStatus:
      type: object
      properties:
        status:
          allOf:
          - $ref: '#/components/schemas/HealthStatusStatusEnum'
          description: |-
            ok when the probe succeeds; unavailable when readiness fails.

            * `ok` - ok
            * `unavailable` - unavailable
      required:
      - status
    HealthStatusStatusEnum:
      enum:
      - ok
      - unavailable
      type: string
      description: |-
        * `ok` - ok
        * `unavailable` - unavailable
    LocaleEnum:
      enum:
      - en
      type: string
      description: '* `en` - en'
    LockReasonsEnum:
      enum:
      - login_required
      - entitlement_required
      type: string
      description: |-
        * `login_required` - login_required
        * `entitlement_required` - entitlement_required
    NullEnum:
      enum:
      - null
    OfferMethod:
      type: object
      properties:
        type:
          allOf:
          - $ref: '#/components/schemas/TypeEnum'
          description: |-
            MVP offer method: entitlement, free, or rewarded_ad. Coin and subscription are omitted.

            * `entitlement` - entitlement
            * `free` - free
            * `rewarded_ad` - rewarded_ad
        title:
          type: string
          description: English display title. Not legal or store copy.
        description:
          type: string
          description: English display description. Not legal or store copy.
      required:
      - description
      - title
      - type
    PatchedAccountPreferencesRequest:
      type: object
      properties:
        locale:
          $ref: '#/components/schemas/LocaleEnum'
        country:
          oneOf:
          - type: string
            pattern: ^[A-Za-z]{2}$
          - type: string
            maxLength: 0
        analytics_consent:
          type: boolean
        ads_consent:
          type: boolean
    PlaybackAuthorizeGranted:
      type: object
      properties:
        decision:
          allOf:
          - $ref: '#/components/schemas/PlaybackAuthorizeGrantedDecisionEnum'
          description: |-
            granted when playback is authorized and a short-lived URL is returned.

            * `granted` - granted
        access_method:
          allOf:
          - $ref: '#/components/schemas/AccessMethodEnum'
          description: |-
            Server-authoritative reason this grant is playable: free policy, verified rewarded-ad entitlement, or staff support entitlement.

            * `free` - free
            * `rewarded_ad` - rewarded_ad
            * `staff` - staff
        playback_url:
          type: string
          format: uri
          description: Opaque HTTPS HLS playlist URL. Short-lived. Does not include
            Bunny library ids, video ids as separate fields, or an embed player URL.
            Django never serves these bytes.
        expires_at:
          type: string
          format: date-time
          description: UTC expiry of this playback URL. Clients must re-authorize
            after expiry.
      required:
      - access_method
      - decision
      - expires_at
      - playback_url
    PlaybackAuthorizeGrantedDecisionEnum:
      enum:
      - granted
      type: string
      description: '* `granted` - granted'
    PlaybackAuthorizeLocked:
      type: object
      properties:
        decision:
          allOf:
          - $ref: '#/components/schemas/PlaybackAuthorizeLockedDecisionEnum'
          description: |-
            locked when the episode is catalog-eligible but not playable.

            * `locked` - locked
        lock_reasons:
          type: array
          items:
            $ref: '#/components/schemas/LockReasonsEnum'
          description: 'Non-empty machine-readable lock reasons. Closed set: login_required,
            entitlement_required. Unlock methods are on GET /v1/offers/{episode_id}.
            This response never includes offers or a playback URL.'
      required:
      - decision
      - lock_reasons
    PlaybackAuthorizeLockedDecisionEnum:
      enum:
      - locked
      type: string
      description: '* `locked` - locked'
    PlaybackAuthorizeResponse:
      oneOf:
      - $ref: '#/components/schemas/PlaybackAuthorizeGranted'
      - $ref: '#/components/schemas/PlaybackAuthorizeLocked'
      discriminator:
        propertyName: decision
        mapping:
          granted: '#/components/schemas/PlaybackAuthorizeGranted'
          locked: '#/components/schemas/PlaybackAuthorizeLocked'
    PublicId:
      type: string
      minLength: 1
      description: Opaque public identifier. Sequential database integers are never
        used as public IDs.
      example: ser_1a2b3c4d5e6f
    RewardIntent:
      type: object
      properties:
        id:
          type: string
          format: uuid
        episode_id:
          type: string
        status:
          allOf:
          - $ref: '#/components/schemas/RewardIntentStatusEnum'
          readOnly: true
        grant_source:
          readOnly: true
          nullable: true
          description: |-
            Server-derived verified grant source. Null until the provider callback has created or confirmed the entitlement.

            * `admob_ssv` - admob_ssv
          oneOf:
          - $ref: '#/components/schemas/GrantSourceEnum'
          - $ref: '#/components/schemas/NullEnum'
        expires_at:
          type: string
          format: date-time
        reward_description:
          type: string
          readOnly: true
        ad_unit_id:
          type: string
        ssv_user_id:
          type: string
        custom_data:
          type: string
      required:
      - ad_unit_id
      - custom_data
      - episode_id
      - expires_at
      - grant_source
      - id
      - reward_description
      - ssv_user_id
      - status
    RewardIntentCreateRequest:
      type: object
      properties:
        episode_id:
          type: string
          minLength: 1
          maxLength: 40
        request_id:
          type: string
          format: uuid
        accepted:
          type: boolean
      required:
      - accepted
      - episode_id
      - request_id
    RewardIntentStatusEnum:
      enum:
      - pending
      - granted
      - expired
      - unavailable
      type: string
      description: |-
        * `pending` - pending
        * `granted` - granted
        * `expired` - expired
        * `unavailable` - unavailable
    TypeEnum:
      enum:
      - entitlement
      - free
      - rewarded_ad
      type: string
      description: |-
        * `entitlement` - entitlement
        * `free` - free
        * `rewarded_ad` - rewarded_ad
    WatchProgress:
      type: object
      properties:
        episode_id:
          type: string
          description: Opaque episode public id.
        position_seconds:
          type: integer
        completed:
          type: boolean
        updated_at:
          type: string
          format: date-time
      required:
      - completed
      - episode_id
      - position_seconds
      - updated_at
    WatchProgressWriteRequest:
      type: object
      properties:
        position_seconds:
          type: integer
          description: Playback position in seconds. Clamped to the episode duration
            on the server.
        completed:
          type: boolean
          default: false
          description: Client completion flag. The server also records completion
            at 95% of duration. Once true, completed stays true.
      required:
      - position_seconds
  securitySchemes:
    FirebaseAppCheck:
      type: apiKey
      in: header
      name: X-Firebase-AppCheck
      description: Firebase App Check token for the Android app, verified by Django
        before protected consumer API work. This attests the app installation and
        does not replace Firebase user authentication or endpoint authorization. Enforcement
        remains disabled until the recorded Play Integrity and development-client
        validation passes.
    FirebaseDeletionIdToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Firebase Authentication ID token presented as an HTTP Bearer credential.
        Django verifies the token and maps the UID to one local profile. Health probes
        and anonymous catalog reads do not use this scheme. POST /v1/playback/{episode_id}/authorize
        and GET/PUT /v1/progress/{episode_id} and GET /v1/offers/{episode_id} accept
        this scheme optionally: a missing token is anonymous; a present invalid token
        is 401. Client-supplied user or profile identifiers are ignored.'
    FirebaseIdToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Firebase Authentication ID token presented as an HTTP Bearer credential.
        Django verifies the token and maps the UID to one local profile. Health probes
        and anonymous catalog reads do not use this scheme. POST /v1/playback/{episode_id}/authorize
        and GET/PUT /v1/progress/{episode_id} and GET /v1/offers/{episode_id} accept
        this scheme optionally: a missing token is anonymous; a present invalid token
        is 401. Client-supplied user or profile identifiers are ignored.'
