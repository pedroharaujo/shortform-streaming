    lock is HTTP 403 and the response never includes a playback URL. The MVP catalog
    is fixed to France, Android, and English; client-supplied market headers cannot
    alter eligibility. GET /v1/me requires FirebaseIdToken; missing or invalid tokens
    return 401 ErrorEnvelope. firebase_uid is never returned. Django never serves
    video bytes.'
