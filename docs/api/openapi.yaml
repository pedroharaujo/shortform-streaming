          type: string
          description: Opaque episode public id.
        order:
          type: integer
        duration_seconds:
          type: integer
        title:
          type: string
        synopsis:
          type: string
      required:
      - duration_seconds
      - id
      - order
      - synopsis
      - title
    CatalogHome:
      type: object
      properties:
        rails:
          type: array
          items:
            $ref: '#/components/schemas/CatalogRail'
      required:
      - rails
    CatalogRail:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        series:
          type: array
          items:
            $ref: '#/components/schemas/CatalogSeriesCard'
      required:
      - id
      - series
      - title
    CatalogSeason:
      type: object
      properties:
        number:
          type: integer
        episodes:
          type: array
          items:
            $ref: '#/components/schemas/CatalogEpisodeSummary'
      required:
      - episodes
      - number
    CatalogSeriesCard:
      type: object
      properties:
        id:
          type: string
          description: Opaque series public id.
        title:
          type: string
        synopsis:
          type: string
        artwork_url:
          type: string
          nullable: true
        original_language:
          type: string
      required:
      - artwork_url
      - id
      - original_language
      - synopsis
      - title
    CatalogSeriesDetail:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        synopsis:
          type: string
        artwork_url:
          type: string
          nullable: true
        original_language:
          type: string
        genres:
          type: array
          items:
            type: string
        seasons:
          type: array
          items:
            $ref: '#/components/schemas/CatalogSeason'
      required:
      - artwork_url
      - genres
      - id
      - original_language
      - seasons
      - synopsis
      - title
    CurrentUserProfile:
      type: object
      properties:
        public_id:
          type: string
          description: Opaque profile public id. Sequential database integers are
            never used.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
      - created_at
      - public_id
      - updated_at
    CursorPage:
      type: object
      description: Cursor-paginated list envelope. `cursor` and `next` are opaque
        strings, never numeric offsets. Concrete list operations replace `results`
        item types.
      required:
      - cursor
      - next
      - results
      properties:
        cursor:
          type: string
          nullable: true
          description: Opaque cursor for the current page.
        next:
          type: string
          nullable: true
          description: Opaque cursor for the next page, or null when none remains.
        results:
          type: array
          description: Page of resources. Item schemas are specified per list operation.
          items:
            type: object
            additionalProperties: true
    ErrorEnvelope:
      type: object
      description: Stable API error envelope. `message` is a safe, user-displayable
        string. `request_id` is the correlation identifier for the request.
      required:
      - code
      - message
      - request_id
      properties:
        code:
          type: string
          description: Stable machine-readable error code.
          minLength: 1
        message:
          type: string
          description: Safe, user-displayable error message. Never includes secrets.
        request_id:
          type: string
          description: Correlation / request identifier for support and tracing.
          minLength: 1
        field_errors:
          type: array
          description: Optional per-field validation errors.
          items:
            $ref: '#/components/schemas/FieldError'
    FieldError:
      type: object
      description: A single field-level validation error.
      required:
      - field
      - code
      - message
      properties:
        field:
          type: string
          description: Field name, or empty for non-field errors.
        code:
          type: string
          description: Machine-readable field error code.
          minLength: 1
        message:
          type: string
          description: Safe, user-displayable field message.
    HealthStatus:
      type: object
      properties:
        status:
          allOf:
          - $ref: '#/components/schemas/StatusEnum'
          description: |-
            ok when the probe succeeds; unavailable when readiness fails.

            * `ok` - ok
            * `unavailable` - unavailable
      required:
      - status
    LockReasonsEnum:
      enum:
      - login_required
      - entitlement_required
      type: string
      description: |-
        * `login_required` - login_required
        * `entitlement_required` - entitlement_required
    PlaybackAuthorizeGranted:
      type: object
      properties:
        decision:
          allOf:
          - $ref: '#/components/schemas/PlaybackAuthorizeGrantedDecisionEnum'
          description: |-
            granted when playback is authorized and a short-lived URL is returned.

            * `granted` - granted
        playback_url:
          type: string
          format: uri
          description: Opaque HTTPS HLS playlist URL. Short-lived. Does not include
            Bunny library ids, video ids as separate fields, or an embed player URL.
            Django never serves these bytes.
        expires_at:
          type: string
          format: date-time
          description: UTC expiry of this playback URL. Clients must re-authorize
            after expiry.
      required:
      - decision
      - expires_at
      - playback_url
    PlaybackAuthorizeGrantedDecisionEnum:
      enum:
      - granted
      type: string
      description: '* `granted` - granted'
    PlaybackAuthorizeLocked:
      type: object
      properties:
        decision:
          allOf:
          - $ref: '#/components/schemas/PlaybackAuthorizeLockedDecisionEnum'
          description: |-
            locked when the episode is catalog-eligible but not playable.

            * `locked` - locked
        lock_reasons:
          type: array
          items:
            $ref: '#/components/schemas/LockReasonsEnum'
          description: 'Non-empty machine-readable lock reasons. Closed set: login_required,
            entitlement_required. Offers are omitted until P3.'
      required:
      - decision
      - lock_reasons
    PlaybackAuthorizeLockedDecisionEnum:
      enum:
      - locked
      type: string
      description: '* `locked` - locked'
    PlaybackAuthorizeResponse:
      oneOf:
      - $ref: '#/components/schemas/PlaybackAuthorizeGranted'
      - $ref: '#/components/schemas/PlaybackAuthorizeLocked'
      discriminator:
        propertyName: decision
        mapping:
          granted: '#/components/schemas/PlaybackAuthorizeGranted'
          locked: '#/components/schemas/PlaybackAuthorizeLocked'
    PublicId:
      type: string
      minLength: 1
      description: Opaque public identifier. Sequential database integers are never
        used as public IDs.
      example: ser_1a2b3c4d5e6f
    StatusEnum:
      enum:
      - ok
      - unavailable
      type: string
      description: |-
        * `ok` - ok
        * `unavailable` - unavailable
    WatchProgress:
      type: object
      properties:
        episode_id:
          type: string
          description: Opaque episode public id.
        position_seconds:
          type: integer
        completed:
          type: boolean
        updated_at:
          type: string
          format: date-time
      required:
      - completed
      - episode_id
      - position_seconds
      - updated_at
    WatchProgressWriteRequest:
      type: object
      properties:
        position_seconds:
          type: integer
          description: Playback position in seconds. Clamped to the episode duration
            on the server.
        completed:
          type: boolean
          default: false
          description: Client completion flag. The server also records completion
            at 95% of duration. Once true, completed stays true.
      required:
      - position_seconds
  securitySchemes:
    FirebaseIdToken:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 'Firebase Authentication ID token presented as an HTTP Bearer credential.
        Django verifies the token and maps the UID to one local profile. Health probes
        and anonymous catalog reads do not use this scheme. POST /v1/playback/{episode_id}/authorize
        and GET/PUT /v1/progress/{episode_id} accept this scheme optionally: a missing
        token is anonymous; a present invalid token is 401. Client-supplied user or
        profile identifiers are ignored.'
